    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              creme: {
                DEFAULT: '#E1F0F8',
                light: '#F0F8FD',
                dark: '#CBE5F5',
              },
              sand: {
                DEFAULT: '#BFDCED',
                light: '#D3E9F7',
                dark: '#A3C8DF',
              },
              dustyPink: {
                DEFAULT: '#E5BACB',
                light: '#F4DEE7',
                dark: '#C88FA6',
              },
              burgundy: {
                DEFAULT: '#650000',
                light: '#7F0F21',
                dark: '#4A0000',
                deep: '#360000',
                cherry: '#8C1227',
              },
              cherryRed: {
                DEFAULT: '#650000',
                light: '#7F0F21',
                dark: '#4A0000',
                deep: '#360000',
                vibrant: '#8C1227',
              },
              maroon: {
                DEFAULT: '#650000',
                light: '#7F0F21',
                dark: '#4A0000',
              },
              babyBlue: {
                DEFAULT: '#89CFF0',
                light: '#EBF6FC',
                soft: '#D5EEFB',
                dark: '#67BDE4',
                accent: '#4AAFD9',
                deep: '#2989B8',
              },
              primary: {
                DEFAULT: '#650000',
                light: '#7F0F21',
                dark: '#4A0000',
              },
              neutral: {
                background: '#EAF5FB',
                card: '#FFFFFF',
                text: '#650000',
                muted: '#5F3038',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
              serif: ['Bodoni Moda', 'Cormorant Garamond', 'Playfair Display', 'serif'],
              editorial: ['Instrument Serif', 'Cormorant Garamond', 'serif'],
              italiana: ['Italiana', 'Cormorant Garamond', 'serif'],
              bodoni: ['Bodoni Moda', 'Cormorant Garamond', 'serif'],
              cinzel: ['Cinzel', 'serif'],
              handwriting: ['Caveat', 'cursive'],
              script: ['Alex Brush', 'Caveat', 'cursive'],
              mono: ['Space Mono', 'monospace'],
              display: ['Bodoni Moda', 'Italiana', 'Cormorant Garamond', 'serif'],
            },
            animation: {
              'float-slow': 'floatSlow 6s ease-in-out infinite',
              'float-reverse': 'floatReverse 5s ease-in-out infinite',
              'sway': 'sway 4s ease-in-out infinite',
              'wiggle-gentle': 'wiggleGentle 3s ease-in-out infinite',
              'pulse-soft': 'pulseSoft 2.5s ease-in-out infinite',
            },
            keyframes: {
              floatSlow: {
                '0%, 100%': { transform: 'translateY(0px) rotate(var(--tw-rotate, 0deg))' },
                '50%': { transform: 'translateY(-12px) rotate(var(--tw-rotate, 0deg))' },
              },
              floatReverse: {
                '0%, 100%': { transform: 'translateY(0px) rotate(var(--tw-rotate, 0deg))' },
                '50%': { transform: 'translateY(10px) rotate(var(--tw-rotate, 0deg))' },
              },
              sway: {
                '0%, 100%': { transform: 'rotate(-4deg) translateY(0px)' },
                '50%': { transform: 'rotate(4deg) translateY(-8px)' },
              },
              wiggleGentle: {
                '0%, 100%': { transform: 'rotate(0deg)' },
                '25%': { transform: 'rotate(-3deg)' },
                '75%': { transform: 'rotate(3deg)' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                '50%': { opacity: 0.85, transform: 'scale(1.03)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      html { 
        scroll-behavior: smooth; 
        scroll-padding-top: 4rem; 
      }
      body { 
        -webkit-font-smoothing: antialiased;
        background-color: #EAF5FB;
        color: #650000;
      }
      .glass { 
        background: rgba(235, 246, 252, 0.88); 
        backdrop-filter: blur(12px); 
      }
      .glass-burgundy, .glass-cherry {
        background: rgba(101, 0, 0, 0.90);
        backdrop-filter: blur(12px);
      }
      .gradient-burgundy, .gradient-cherry {
        background: linear-gradient(135deg, #650000 0%, #8C1227 100%);
      }
      /* Custom scrollbar for aesthetic feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #D5EEFB;
      }
      ::-webkit-scrollbar-thumb {
        background: #650000;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8C1227;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Paper/vintage texture overlay */
      .bg-vintage-grain {
        background-image: radial-gradient(rgba(101, 0, 0, 0.04) 1px, transparent 0);
        background-size: 16px 16px;
      }
    </style>
